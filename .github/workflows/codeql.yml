# CodeQL code scanning for the C++ code (src/, src_radio/) and the workflows, without the vendored third_party/ libraries.
# Results: Security tab -> Code scanning. Replaces GitHub's "default setup": switch that off first
# (Settings -> Advanced Security -> CodeQL analysis -> ... -> Disable CodeQL), otherwise the two clash.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: c-cpp, build-mode: manual }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build (C++ only)
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
