# Builds the Android app of the remote control (remote_app/android) and offers the APK as a download.
# Actions tab -> "Remote app (Android)" -> the latest run -> Artifacts -> mousiki-remote-apk.
name: Remote app (Android)

on:
  workflow_dispatch:
  push:
    paths:
      - 'remote_app/android/**'
      - '.github/workflows/remote-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build the APK
        working-directory: remote_app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk mousiki-remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mousiki-remote-apk
          path: remote_app/android/mousiki-remote.apk
