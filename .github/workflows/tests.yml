name: Tests

# Builds Mousiki with the automated tests (tests/) and runs them on Linux, macOS and Windows.
# Runs on every push and pull request; it can also be started by hand (Actions -> Tests -> Run workflow).
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch / pull request cancels the run that is still going: no red runs for half-finished uploads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04 }
          - { name: macOS,   os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMOUSIKI_BUILD_TESTS=ON

      - name: Build the tests
        run: cmake --build build --config Release --target mousiki_tests --parallel 4

      - name: Run the tests
        run: ctest --test-dir build -C Release --output-on-failure

  # The same tests with AddressSanitizer + UndefinedBehaviorSanitizer (and leak detection): finds out-of-bounds reads / writes,
  # use after free, integer overflow and the like in the file parsers that normal runs can miss.
  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMOUSIKI_BUILD_TESTS=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build the tests
        run: cmake --build build --target mousiki_tests --parallel 4

      - name: Run the tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
