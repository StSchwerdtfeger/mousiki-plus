name: Fuzz

# libFuzzer runs on the parsers that read input from outside (fuzz/): lyrics, JSON, playlists, cue files and the requests of the remote app's
# web server -- with AddressSanitizer and UndefinedBehaviorSanitizer. Once a week for a few minutes (a crash is an artifact of the run and
# makes it red), and by hand (Actions -> Fuzz -> Run workflow, with the minutes per target). The valid examples in fuzz/corpus/ are the start;
# what the fuzzers found interesting (fuzz-corpus*/) is kept as an artifact of the run and read back by the next one, so the coverage builds
# up week by week; a crash is an artifact too. Every target runs twice: with inputs up to 8 KB, then with inputs up to 1 MB.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "300"

permissions:
  contents: read
  actions: read   # to download the corpus of the last run

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install clang and the sanitizer runtime
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev

      # The corpus of the last run that left one (artifacts are kept 90 days): `gh` is on the runner. No corpus yet = the seeds only.
      - name: Get the corpus of the last runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fuzz-corpus fuzz-corpus-large
          for id in $(gh run list --workflow fuzz.yml --limit 10 --json databaseId,status --jq '.[] | select(.status=="completed") | .databaseId'); do
            if gh run download "$id" -n fuzz-corpus -D corpus-download 2>/dev/null; then
              cp -r corpus-download/. . && echo "corpus of run $id"; break
            fi
          done
          find fuzz-corpus fuzz-corpus-large -type f | wc -l

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMOUSIKI_FUZZ=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DMOUSIKI_USE_CCACHE=OFF -DMOUSIKI_PCH=OFF

      - name: Build the fuzz targets
        run: cmake --build build --parallel 4 --target mousiki_fuzz_lyrics mousiki_fuzz_json mousiki_fuzz_remote mousiki_fuzz_playlist mousiki_fuzz_cue mousiki_fuzz_tags mousiki_fuzz_decoder

      - name: Fuzz every target
        env:
          SECONDS_EACH: ${{ github.event.inputs.seconds || '240' }}
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=0
        run: |
          status=0
          for t in lyrics json remote playlist cue tags decoder; do
            mkdir -p "fuzz-corpus/$t" "crashes/$t"
            echo "::group::$t"
            build/mousiki_fuzz_$t -max_total_time="$SECONDS_EACH" -timeout=20 -max_len=8192 -rss_limit_mb=2048 \
              -artifact_prefix="crashes/$t/" "fuzz-corpus/$t" "fuzz/corpus/$t" || status=1
            echo "::endgroup::"
          done
          exit $status

      # The first run keeps inputs to 8 KB, which is where a number of hundreds of digits in a lyrics line never shows up: a second,
      # shorter run per target lets inputs grow to 1 MB (a number that is too long, a huge tag or a long list are found here).
      - name: Fuzz with large inputs
        env:
          SECONDS_EACH: ${{ github.event.inputs.seconds || '240' }}
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=0
        run: |
          status=0
          for t in lyrics json playlist cue tags decoder; do
            mkdir -p "fuzz-corpus-large/$t" "crashes/large-$t"
            echo "::group::$t (large)"
            build/mousiki_fuzz_$t -max_total_time="$((SECONDS_EACH / 3))" -timeout=30 -max_len=1048576 -rss_limit_mb=3072 \
              -artifact_prefix="crashes/large-$t/" "fuzz-corpus-large/$t" "fuzz/corpus/$t" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Keep the corpus for the next run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: fuzz-corpus
          path: |
            fuzz-corpus
            fuzz-corpus-large
          retention-days: 90
          if-no-files-found: ignore

      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes
